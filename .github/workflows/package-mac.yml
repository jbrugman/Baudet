name: Package and release macOS app

# Builds the .app on a macOS runner, uploads it as a build artifact, and -- for a
# qualifying push to main -- publishes a GitHub Release. The release tag comes from
# the bundle version stamped from the pom (see make-mac-app.sh), so the tag, the jar
# and the Info.plist version all agree and a new release only appears when the pom
# version is bumped (an existing tag is re-uploaded with --clobber).
on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: package-mac-main
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Release eligibility
        id: eligibility
        uses: actions/github-script@v9
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const isDependabot = context.actor === 'dependabot[bot]'
              || prs.some((pr) => pr.user?.login === 'dependabot[bot]');
            const hasNoRelease = prs.some((pr) =>
              pr.head?.ref === 'norelease' || (pr.head?.ref || '').startsWith('norelease/'));
            const shouldRelease = !isDependabot && !hasNoRelease;
            core.setOutput('should-release', String(shouldRelease));
            core.info(shouldRelease ? 'Release is eligible.' : 'Skipping non-release change.');

      - name: Build and package the .app
        run: mvn -B clean verify -Pmac-app

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v7
        with:
          name: Baudet-mac-app
          path: target/dist/

      - name: Publish GitHub release
        if: steps.eligibility.outputs.should-release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            target/dist/Baudet.app/Contents/Info.plist)"
          TAG="v${VERSION}"
          ZIP="Baudet-${VERSION}-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent target/dist/Baudet.app "$ZIP"
          # Offer the runnable jar too: the .app is ad-hoc signed, so a downloaded copy
          # is blocked by Gatekeeper -- the jar is the artifact that runs on any JVM.
          SHADED_JAR="$(find target -maxdepth 1 -name 'baudet-*.jar' ! -name 'original-*' | sort | head -n 1)"
          JAR="Baudet-${VERSION}.jar"
          cp "$SHADED_JAR" "$JAR"
          NOTES="Assets: ${ZIP} (ad-hoc-signed .app; needs a Developer ID + notarization to open on another Mac) and ${JAR} (runnable jar; the portable artifact, run with java -jar ${JAR})."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; re-uploading ${ZIP} and ${JAR}"
            gh release upload "$TAG" "$ZIP" "$JAR" --clobber
          else
            echo "Creating release $TAG with ${ZIP} and ${JAR}"
            gh release create "$TAG" "$ZIP" "$JAR" \
              --target "${GITHUB_SHA}" \
              --title "$TAG" \
              --notes "$NOTES" \
              --generate-notes
          fi
