name: Package macOS app

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: package-mac-main
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and package the .app
        run: mvn -B clean verify -Pmac-app

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: Mule-mac-app
          path: target/dist/
